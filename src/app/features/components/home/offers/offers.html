<section class="py-10 bg-stone-50/40" dir="rtl">
  <div class="max-w-screen-xl mx-auto px-4">
    <!-- Header Section (العنوان والرابط) -->
    <div class="flex items-end justify-between mb-6">
      <!-- Title Right -->
      <div>
        <span class="text-xs font-bold text-amber-600 tracking-wide block mb-1">
          اختيارات موفرة
        </span>
        <h2 class="text-2xl md:text-3xl font-black text-emerald-950 tracking-tight">
          عروض العيلة والتوفير
        </h2>
      </div>

      <!-- View All Link Left -->
      <a
        routerLink="/savingsOffers"
        class="group flex items-center gap-1.5 text-xs md:text-sm font-bold text-amber-600 hover:text-amber-700 transition-colors"
      >
        <span>شوف كل العروض</span>
        <i
          class="fa-solid fa-arrow-left text-xs group-hover:-translate-x-1 transition-transform"
        ></i>
      </a>
    </div>

    <!-- Offers Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
      @for (offer of offers(); track offer.id) {
        <div
          routerLink="/savingsOffers"
          class="group relative flex flex-row sm:flex-row items-stretch bg-[#FFFDF5] border border-amber-300/60 rounded-2xl overflow-hidden shadow-xs hover:shadow-md hover:border-amber-400 transition-all duration-300 cursor-pointer"
        >
          <!-- Offer Details Side -->
          <div class="w-full sm:w-3/5 p-5 flex flex-col justify-between items-start text-right">
            <!-- Top Badge & Titles -->
            <div class="w-full">
              <!-- Discount Badge -->
              <div
                class="inline-block bg-red-600 text-white text-[11px] font-extrabold px-3 py-1 rounded-md shadow-xs mb-3"
              >
                {{ offer.category }}
              </div>

              <!-- Main Title -->
              <h3
                class="text-lg md:text-xl font-black text-amber-900 group-hover:text-emerald-900 transition-colors leading-snug"
              >
                {{ offer.title }}
              </h3>

              <!-- Subtitle / Description -->
              @for (offer of offers(); track offer.id) {
                <p class="text-xs text-stone-500 font-medium mt-1 leading-relaxed">
                  {{ offer.offer_items }}
                </p>
              }
            </div>

            <!-- Action Button -->
            <div class="mt-4 w-full sm:w-auto">
              <button
                type="button"
                routerLink="/savingsOffers"
                class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-extrabold text-xs px-6 py-2.5 rounded-lg shadow-xs transition-all duration-200 cursor-pointer flex items-center justify-center gap-2"
              >
                <span> شوف كل العروض</span>
                <i class="fa-solid fa-arrow-left text-xs"></i>
              </button>
            </div>
          </div>
          <!-- Offer Image Side -->
          <div class="w-2/5 min-h-[160px] sm:min-h-[190px] relative overflow-hidden shrink-0">
            <img
              [src]="offer.image_url"
              [alt]="offer.title"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
              loading="lazy"
            />
          </div>
        </div>
      }
    </div>
  </div>
</section>
