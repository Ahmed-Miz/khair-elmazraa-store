<section class="py-8 bg-stone-50/50 border-y border-stone-100" dir="rtl">
  <div class="max-w-screen-xl mx-auto px-4">
    <!-- Categories Grid / Flex Container -->
    <div class="grid grid-cols-3 gap-6 md:gap-8 justify-items-center items-center">
      @for (category of categories(); track category.id) {
        <a
          [routerLink]="['/shop']"
          [queryParams]="{ category: category.queryParam }"
          class="group flex flex-col items-center cursor-pointer text-center w-full max-w-[160px]"
        >
          <!-- Image Wrapper with Circular Border and Shadow -->
          <div
            class="relative w-20 h-20 sm:w-30 sm:h-30 rounded-full p-1 bg-white shadow-md shadow-stone-200/60 border border-stone-100 group-hover:shadow-lg group-hover:scale-105 transition-all duration-300"
          >
            <img
              [src]="category.image"
              [alt]="category.name"
              class="w-full h-full object-cover rounded-full"
              loading="lazy"
            />
          </div>

          <!-- Category Name -->
          <h3
            class="mt-3 text-sm md:text-base font-bold text-emerald-950 group-hover:text-emerald-700 transition-colors duration-200 leading-snug"
          >
            {{ category.name }}
          </h3>
        </a>
      }
    </div>
  </div>
</section>
