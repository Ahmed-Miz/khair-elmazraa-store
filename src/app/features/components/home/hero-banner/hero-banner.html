<header class="relative w-full my-4 px-2 md:px-4">
  <div
    class="relative w-full h-[400px] md:h-[520px] overflow-hidden rounded-3xl shadow-2xl border border-emerald-500/20 group"
  >
    <!-- Overlay تدريجي فخم عشان يبرز الكلام ويخلي الفيديو واضح وناعم -->
    <div
      class="absolute inset-0 bg-gradient-to-t from-stone-950/90 via-stone-900/40 to-stone-950/25 z-10"
    ></div>

    <!-- Hero Video (تم تصحيح ربط الرابط للأنجولير) -->
    <video
      [src]="videoUrl()"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      class="absolute inset-0 w-full h-full object-cover scale-105 transition-transform duration-1000 group-hover:scale-100"
    ></video>

    <!-- Content Over Video (النص، الشعار، والزرار الجذاب) -->
    <div
      class="absolute inset-0 z-20 flex flex-col items-center justify-center text-center text-white px-6 md:px-12 max-w-3xl mx-auto"
    >
      <!-- بادج ترويجي جذاب يفتح النفس -->
      <span
        class="inline-flex items-center gap-2 bg-amber-500/90 text-stone-950 text-xs md:text-sm font-black px-4 py-1.5 rounded-full mb-4 shadow-lg backdrop-blur-md animate-pulse"
      >
        <i class="fa-solid fa-fire text-amber-950"></i>
        طازج يومياً 100% - جودة عالية تستحقها
      </span>

      <!-- العنوان الرئيسي -->
      <h1 class="text-3xl md:text-6xl font-black mb-4 tracking-tight leading-tight drop-shadow-md">
        {{ title() }}
      </h1>

      <!-- الوصف -->
      <p
        class="text-xs md:text-base text-stone-200 max-w-xl mb-8 leading-relaxed font-medium drop-shadow"
      >
        {{ subtitle() }}
      </p>

      <!-- زر الشراء بتصميم تفاعلي ساحر -->
      <a
        routerLink="/shop"
        class="group/btn relative inline-flex items-center gap-3 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-stone-950 font-black text-sm md:text-base px-8 py-4 rounded-full transition-all duration-300 shadow-xl hover:shadow-emerald-500/50 hover:scale-105 active:scale-95 text-white"
      >
        <span>تسوق المنتجات الآن</span>
        <i class="fa-solid fa-arrow-left transition-transform group-hover/btn:-translate-x-1"></i>
      </a>
    </div>
  </div>
</header>
